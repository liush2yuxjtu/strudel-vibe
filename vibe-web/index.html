<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<meta name="description" content="vibe-music — 用一句话写音乐。DeepSeek 生成 Strudel，浏览器实时演奏。" />
<title>vibe-music · 用一句话写音乐</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23141210'/><rect x='6' y='6' width='8' height='8' rx='1.5' fill='%23FFB000'/><rect x='18' y='6' width='8' height='8' rx='1.5' fill='%233A342E'/><rect x='6' y='18' width='8' height='8' rx='1.5' fill='%233A342E'/><rect x='18' y='18' width='8' height='8' rx='1.5' fill='%23C46B3A'/></svg>" />
<!-- Strudel engine vendored locally (same bytes as @strudel/web@1.2.6) so it loads
     without unpkg.com — which is unreliable/blocked in mainland China. -->
<script src="vendor/strudel-web-1.2.6.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    /* Drum-machine chassis: warm metal, amber LEDs — not acid-green / pure black */
    --chassis:#141210;
    --bay:#1E1A16;
    --recess:#0F0D0B;
    --ink:#F2EDE4;
    --mute:#8A8178;
    --faint:#5C554E;
    --line:#2E2924;
    --line2:#3A342E;
    --led:#FFB000;
    --led-dim:rgba(255,176,0,.18);
    --copper:#C46B3A;
    --hot:#E23D4A;
    --ok:#6FCF97;
    --sans:"Noto Sans SC",system-ui,-apple-system,sans-serif;
    --display:"Syne","Noto Sans SC",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
    --radius-pad:10px;
    --radius-soft:14px;
    --focus:0 0 0 3px rgba(255,176,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(900px 520px at 100% -10%, rgba(196,107,58,.14), transparent 55%),
      radial-gradient(700px 480px at -5% 110%, rgba(255,176,0,.07), transparent 50%),
      var(--chassis);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a{color:var(--led); text-decoration-thickness:1px; text-underline-offset:3px}
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:none; box-shadow:var(--focus);
  }

  /* ——— top bar ——— */
  .top{
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:22px clamp(18px,4vw,36px) 8px; max-width:920px; width:100%; margin:0 auto;
  }
  .brand{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .wordmark{
    font-family:var(--display); font-weight:800; font-size:clamp(26px,5vw,34px);
    letter-spacing:-.04em; line-height:1; margin:0;
  }
  .wordmark span{color:var(--led)}
  .tagline{color:var(--mute); font-size:13.5px; font-weight:400; max-width:28ch; line-height:1.4}
  .status-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .led-pill{
    display:inline-flex; align-items:center; gap:8px;
    font-size:12px; color:var(--mute); background:var(--bay);
    border:1px solid var(--line); border-radius:999px; padding:6px 12px 6px 10px;
  }
  .led-dot{
    width:8px; height:8px; border-radius:50%; background:var(--faint);
    box-shadow:inset 0 0 0 1px var(--line2);
  }
  .led-dot.on{background:var(--led); box-shadow:0 0 10px rgba(255,176,0,.65)}
  .led-dot.ok{background:var(--ok); box-shadow:0 0 8px rgba(111,207,151,.5)}

  /* ——— machine ——— */
  .machine{
    flex:1; width:100%; max-width:920px; margin:0 auto;
    padding:10px clamp(18px,4vw,36px) 28px;
    display:flex; flex-direction:column; gap:18px;
  }
  .face{
    background:linear-gradient(165deg, #221E1A 0%, var(--bay) 40%, #181511 100%);
    border:1px solid var(--line2);
    border-radius:22px;
    padding:clamp(16px,3vw,24px);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.04),
      0 24px 60px -28px rgba(0,0,0,.75);
  }

  .ask{margin:0 0 10px; font-size:14px; color:var(--mute); font-weight:500}
  .promptbox{display:flex; gap:10px; align-items:stretch}
  .promptbox input{
    flex:1; min-width:0;
    background:var(--recess); border:1px solid var(--line); border-radius:var(--radius-soft);
    color:var(--ink); font-family:var(--sans); font-size:16px; font-weight:400;
    padding:14px 16px; transition:border-color .15s;
  }
  .promptbox input::placeholder{color:var(--faint)}
  .promptbox input:focus{border-color:var(--led)}

  .prog{height:3px; border-radius:3px; margin:12px 0 0; background:var(--recess); overflow:hidden; opacity:0; transition:opacity .2s}
  .prog.on{opacity:1}
  .prog i{
    display:block; height:100%; width:38%; border-radius:3px;
    background:linear-gradient(90deg, transparent, var(--led), var(--copper), transparent);
    animation:slide 1.1s ease-in-out infinite;
  }
  @keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}

  .state{margin:12px 0 0; font-size:13.5px; color:var(--mute); min-height:1.35em; line-height:1.45}
  .state b{color:var(--led); font-weight:600}
  .state .dots::after{content:''; animation:dots 1.1s steps(4,end) infinite}
  @keyframes dots{0%{content:''}25%{content:'·'}50%{content:'··'}75%{content:'···'}100%{content:''}}

  /* ——— hero: 16 MPC-style rubber pads ——— */
  .pad-section{margin-top:18px}
  .pad-label{margin:0 0 10px; font-size:13px; color:var(--faint); font-weight:500}
  .pads{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;
    aspect-ratio:1 / 1; max-width:min(420px, 100%); margin:0 auto;
    padding:14px;
    background:
      linear-gradient(180deg, #161310 0%, #0C0A09 100%);
    border:1px solid #0A0908;
    border-radius:16px;
    box-shadow:
      inset 0 2px 6px rgba(0,0,0,.55),
      inset 0 -1px 0 rgba(255,255,255,.03),
      0 1px 0 rgba(255,255,255,.04);
  }
  @media(min-width:720px){
    .pad-layout{display:grid; grid-template-columns:1fr minmax(280px, 380px); gap:22px; align-items:start}
    .pads{margin:0; max-width:none}
  }
  .pad{
    position:relative;
    border:none;
    border-radius:12px;
    /* rubber dome: warm gray top → darker edges */
    background:
      radial-gradient(120% 90% at 35% 22%, rgba(255,255,255,.09) 0%, transparent 42%),
      radial-gradient(80% 70% at 50% 55%, #2C2621 0%, #1A1613 62%, #12100E 100%);
    box-shadow:
      /* raised lip */
      0 1px 0 rgba(255,255,255,.07),
      0 5px 0 #070605,
      0 8px 14px rgba(0,0,0,.45),
      /* soft rubber inset rim */
      inset 0 0 0 1px rgba(0,0,0,.55),
      inset 0 2px 3px rgba(255,255,255,.05),
      inset 0 -3px 5px rgba(0,0,0,.35);
    color:rgba(138,129,120,.55);
    font-family:var(--mono); font-size:clamp(10px,2.4vw,11px); font-weight:600;
    letter-spacing:.06em;
    display:flex; align-items:flex-end; justify-content:flex-start;
    padding:11px 10px;
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent;
    transition:
      transform .08s cubic-bezier(.2,.8,.2,1),
      box-shadow .08s cubic-bezier(.2,.8,.2,1),
      color .15s, filter .12s;
    will-change:transform;
    touch-action:manipulation;
  }
  /* LED diffuser — sits under translucent rubber feel */
  .pad::before{
    content:""; position:absolute; top:11px; right:11px;
    width:8px; height:8px; border-radius:50%;
    background:rgba(255,176,0,.12);
    box-shadow:
      0 0 0 1px rgba(255,176,0,.08),
      inset 0 1px 1px rgba(0,0,0,.4);
    transition:background .1s, box-shadow .1s, transform .08s;
    z-index:2;
  }
  /* light bleed through rubber when lit */
  .pad::after{
    content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 65% at 50% 42%, rgba(255,176,0,0) 0%, transparent 70%);
    opacity:0;
    transition:opacity .1s ease-out;
    mix-blend-mode:screen;
  }
  .pad:hover{
    filter:brightness(1.06);
  }
  .pad:active, .pad.press{
    transform:translateY(4px) scale(.965);
    box-shadow:
      0 0 0 rgba(0,0,0,0),
      0 1px 0 #070605,
      0 2px 6px rgba(0,0,0,.4),
      inset 0 0 0 1px rgba(0,0,0,.65),
      inset 0 4px 10px rgba(0,0,0,.55),
      inset 0 -1px 1px rgba(255,255,255,.03);
  }
  .pad:active::before, .pad.press::before{
    transform:scale(.92);
  }
  .pad.lit{
    color:rgba(255,208,120,.9);
    box-shadow:
      0 1px 0 rgba(255,200,80,.12),
      0 5px 0 #070605,
      0 8px 14px rgba(0,0,0,.45),
      0 0 18px rgba(255,176,0,.14),
      inset 0 0 0 1px rgba(255,176,0,.22),
      inset 0 2px 3px rgba(255,200,100,.08),
      inset 0 -3px 5px rgba(0,0,0,.35);
  }
  .pad.lit::before{
    background:var(--led);
    box-shadow:
      0 0 6px rgba(255,176,0,.95),
      0 0 14px rgba(255,176,0,.55),
      inset 0 1px 1px rgba(255,255,255,.35);
  }
  .pad.lit::after{
    opacity:1;
    background:
      radial-gradient(ellipse 75% 70% at 55% 35%, rgba(255,176,0,.28) 0%, rgba(255,140,40,.08) 45%, transparent 72%);
  }
  .pad.hit, .pad.lit.hit{
    transform:translateY(4px) scale(.96);
    color:var(--ink);
    box-shadow:
      0 0 0 rgba(0,0,0,0),
      0 1px 0 #070605,
      0 2px 8px rgba(255,176,0,.2),
      0 0 28px rgba(255,176,0,.28),
      inset 0 0 0 1px rgba(255,200,80,.45),
      inset 0 5px 14px rgba(0,0,0,.5),
      inset 0 0 24px rgba(255,176,0,.18);
  }
  .pad.hit::before{
    background:#FFE08A;
    box-shadow:
      0 0 10px rgba(255,224,140,1),
      0 0 22px rgba(255,176,0,.85),
      inset 0 1px 1px rgba(255,255,255,.5);
  }
  .pad.hit::after{
    opacity:1;
    background:
      radial-gradient(ellipse 85% 80% at 50% 40%, rgba(255,210,100,.5) 0%, rgba(255,140,40,.18) 40%, transparent 70%);
  }

  .side{display:flex; flex-direction:column; gap:14px; min-width:0}
  .transport{display:flex; gap:8px; flex-wrap:wrap}
  button{
    font-family:var(--sans); font-size:14px; font-weight:600;
    border-radius:12px; border:1px solid var(--line2);
    background:var(--recess); color:var(--ink);
    padding:11px 16px; cursor:pointer;
    transition:border-color .15s, background .15s, transform .12s, opacity .15s;
  }
  button:hover{border-color:var(--copper)}
  button:active{transform:translateY(1px)}
  button.primary{
    background:var(--led); color:#1A1200; border-color:var(--led);
  }
  button.primary:hover{filter:brightness(1.05); border-color:var(--led)}
  button.hot{
    background:transparent; color:var(--hot); border-color:#4A2A2E;
  }
  button.hot:hover{border-color:var(--hot)}
  button[disabled]{opacity:.55; cursor:progress; transform:none}
  button.busy{position:relative; color:transparent !important}
  button.busy::after{
    content:''; position:absolute; inset:0; margin:auto; width:14px; height:14px;
    border:2px solid rgba(26,18,0,.3); border-top-color:#1A1200; border-radius:50%;
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* pads are not transport buttons — reassert rubber look if tagged as button */
  button.pad, .pads .pad{
    font-family:var(--mono); font-size:clamp(10px,2.4vw,11px); font-weight:600;
    letter-spacing:.06em; text-align:left;
  }
  button.pad:hover{border-color:transparent; filter:brightness(1.06)}
  button.pad:active{transform:translateY(4px) scale(.965)}
  button.pad[disabled]{opacity:1; cursor:pointer}

  .chips{display:flex; gap:8px; flex-wrap:wrap}
  .chip{
    font-family:var(--sans); font-size:12.5px; font-weight:500;
    color:var(--mute); background:var(--recess);
    border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer;
    transition:color .15s, border-color .15s;
  }
  .chip:hover, .chip:focus-visible{color:var(--led); border-color:rgba(255,176,0,.4)}

  .log{
    font-family:var(--mono); font-size:12px; color:var(--mute);
    max-height:120px; overflow:auto; line-height:1.7;
    border-top:1px solid var(--line); padding-top:10px; margin-top:2px;
  }
  .log .u{color:var(--copper)} .log .c{color:var(--led)}

  /* ——— LCD code bay ——— */
  .lcd{
    margin-top:4px;
    background:var(--recess);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px 14px 12px;
  }
  .lcd-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:10px;
  }
  .lcd-title{font-size:13px; color:var(--mute); font-weight:500; margin:0}
  .lcd-hint{font-size:12px; color:var(--faint)}
  .code{
    width:100%; min-height:110px; resize:vertical;
    background:#0A0908; color:var(--led);
    border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; font-family:var(--mono); font-size:13.5px; line-height:1.55;
    tab-size:2;
  }
  .code:focus{border-color:rgba(255,176,0,.5)}
  .lcd .row{display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; align-items:center}

  footer{
    padding:8px clamp(18px,4vw,36px) 24px; color:var(--faint);
    font-size:12px; text-align:center; max-width:920px; width:100%; margin:0 auto;
  }
  .pill{
    display:inline-block; padding:2px 8px; border:1px solid var(--line);
    border-radius:999px; font-size:11px; color:var(--mute); font-family:var(--mono);
  }

  /* load cascade for pads — one orchestrated moment */
  @keyframes padIn{
    from{opacity:0; transform:translateY(8px) scale(.96)}
    to{opacity:1; transform:none}
  }
  .pads .pad{animation:padIn .45s cubic-bezier(.2,.8,.2,1) both}
  .pads .pad:nth-child(1){animation-delay:.02s}
  .pads .pad:nth-child(2){animation-delay:.05s}
  .pads .pad:nth-child(3){animation-delay:.08s}
  .pads .pad:nth-child(4){animation-delay:.11s}
  .pads .pad:nth-child(5){animation-delay:.14s}
  .pads .pad:nth-child(6){animation-delay:.17s}
  .pads .pad:nth-child(7){animation-delay:.20s}
  .pads .pad:nth-child(8){animation-delay:.23s}
  .pads .pad:nth-child(9){animation-delay:.26s}
  .pads .pad:nth-child(10){animation-delay:.29s}
  .pads .pad:nth-child(11){animation-delay:.32s}
  .pads .pad:nth-child(12){animation-delay:.35s}
  .pads .pad:nth-child(13){animation-delay:.38s}
  .pads .pad:nth-child(14){animation-delay:.41s}
  .pads .pad:nth-child(15){animation-delay:.44s}
  .pads .pad:nth-child(16){animation-delay:.47s}

  @media (prefers-reduced-motion: reduce){
    .pads .pad{animation:none}
    .prog i{animation:none; width:100%; opacity:.5}
    .state .dots::after{animation:none; content:'…'}
    button.busy::after{animation:none; border-color:#1A1200}
    *{transition:none !important}
  }

  @media(max-width:520px){
    .promptbox{flex-direction:column}
    .pads{gap:8px; padding:10px}
    .pad{padding:8px; font-size:10px; border-radius:10px}
  }
</style>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="wordmark">vibe<span>·music</span></h1>
      <p class="tagline">说一句，DeepSeek 写 Strudel，浏览器立刻响</p>
    </div>
    <div class="status-row">
      <span class="led-pill" title="播放状态"><i class="led-dot" id="playLed"></i> 演奏</span>
      <span class="led-pill"><i class="led-dot" id="apiLed"></i> <span id="status2">API</span></span>
      <span class="led-pill"><span class="pill">deepseek-chat</span></span>
    </div>
  </header>

  <main class="machine">
    <section class="face" aria-label="vibe 鼓机面板">
      <p class="ask" id="askLabel">你想听到什么？</p>
      <div class="promptbox">
        <input id="intent" autocomplete="off" aria-labelledby="askLabel"
          placeholder="例如：四拍底鼓加八分 hihat / a dreamy minor bassline" />
        <button class="primary" id="send" type="button">生成</button>
      </div>
      <div class="prog" id="prog" aria-hidden="true"><i></i></div>
      <div class="state" id="state" role="status" aria-live="polite">点下面的例子，或直接输入。第一次会加载鼓采样…</div>

      <div class="pad-layout pad-section">
        <div>
          <p class="pad-label">胶垫 · 按下去会陷，作曲与演奏时会亮</p>
          <div class="pads" id="pads" aria-hidden="true"></div>
        </div>
        <div class="side">
          <div class="transport">
            <button class="primary" id="play" type="button">播放</button>
            <button class="hot" id="stop" type="button">停止</button>
            <button id="surprise" type="button">随便来一段</button>
          </div>
          <div class="chips" id="chips"></div>
          <div class="log" id="log" aria-label="对话记录"></div>
        </div>
      </div>
    </section>

    <section class="lcd" aria-label="Strudel 代码">
      <div class="lcd-head">
        <h2 class="lcd-title">正在演奏的代码（可改）</h2>
        <span class="lcd-hint" id="vtext">待机</span>
      </div>
      <textarea class="code" id="code" spellcheck="false"
        placeholder="// 生成的 pattern 会出现在这里，改完按「应用编辑」"></textarea>
      <div class="row">
        <button id="apply" type="button">应用编辑</button>
        <span class="state" style="margin:0">声音在你浏览器里出（WebAudio）</span>
      </div>
    </section>
  </main>

  <footer>
    built with <a href="https://strudel.cc" target="_blank" rel="noopener">Strudel</a>
    · NL→code by DeepSeek
    · terminal twin: <span class="pill">/vibe-music</span>
  </footer>

<script>
  const $ = (id)=>document.getElementById(id);
  let started=false, playing=false, current='';
  // phase: 'idle' | 'loading' (engine/samples) | 'composing' (DeepSeek) | 'playing'
  let phase='idle', phaseSince=performance.now();
  const EXAMPLES = [
    "四拍鼓加八分hihat","加一条小调贝斯线","鼓声小一点","更梦幻一点，加点混响",
    "drum and bass beat","a jazzy chord progression","techno with acid bass","空灵的氛围pad",
  ];
  const PAD_LABELS = [
    "BD","SD","HH","OH",
    "CP","LT","MT","HT",
    "RM","CB","CY","RS",
    "T1","T2","T3","T4",
  ];
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const chips=$('chips');
  EXAMPLES.forEach(t=>{
    const c=document.createElement('button');
    c.type='button'; c.className='chip'; c.textContent=t;
    c.onclick=()=>{ $('intent').value=t; vibe(); };
    chips.appendChild(c);
  });

  // Hero: 16 MPC-style rubber pads
  const padsEl=$('pads');
  PAD_LABELS.forEach((lab,i)=>{
    const p=document.createElement('div');
    p.className='pad'; p.textContent=lab; p.dataset.i=String(i);
    p.setAttribute('role','button'); p.tabIndex=0;
    p.setAttribute('aria-label', '垫 '+lab);
    padsEl.appendChild(p);
  });
  const pads=[...padsEl.querySelectorAll('.pad')];

  // Classic 16-step drum map (row-major): BD/SD/HH accents feel like an MPC
  // step 0..15 → which pads fire (index into PAD_LABELS)
  const PLAY_STEPS = [
    [0,2],       // 1: BD + HH
    [2],         // e
    [2,11],      // & HH + RS
    [2],         // a
    [1,2],       // 2: SD + HH
    [2],
    [0,2],       // & kick ghost
    [2,3],       // a OH hint
    [0,2],       // 3
    [2],
    [2,4],       // & clap ghost
    [2],
    [1,2],       // 4 SD
    [2,7],       // e HT
    [0,2,3],     // & BD + OH
    [2],
  ];

  function flashPad(el, ms){
    el.classList.add('hit','lit','press');
    clearTimeout(el._hitT);
    el._hitT = setTimeout(()=>{
      el.classList.remove('hit','press');
      if(phase!=='playing' && phase!=='composing' && phase!=='loading'){
        el.classList.remove('lit');
      }
    }, ms || 90);
  }

  pads.forEach(p=>{
    const down = (e)=>{ e.preventDefault(); flashPad(p, 120); };
    p.addEventListener('pointerdown', down);
    p.addEventListener('keydown', e=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); flashPad(p, 120); }
    });
  });

  let frame=0;
  let padTimer=null;
  let step=0;
  function tickPads(){
    frame++;
    if(phase==='playing'){
      // ~120 BPM sixteenth notes: interval ~110ms → advance step each tick
      step = (step + 1) % 16;
      const active = new Set(PLAY_STEPS[step]);
      pads.forEach((p,i)=>{
        const on = active.has(i);
        p.classList.toggle('lit', on);
        p.classList.toggle('hit', on);
        p.classList.toggle('press', on);
      });
    } else if(phase==='composing' || phase==='loading'){
      // travelling press across the grid — like scanning banks
      const head = Math.floor((frame * 0.55) % 16);
      pads.forEach((p,i)=>{
        const d = Math.min((i - head + 16) % 16, (head - i + 16) % 16);
        const on = d <= 1;
        p.classList.toggle('lit', on);
        p.classList.toggle('hit', d===0);
        p.classList.toggle('press', d===0);
      });
    } else {
      // idle: soft LED breath on bank corners (no fake press)
      const breath = !reduceMotion && Math.sin(frame*0.07) > 0.35;
      pads.forEach((p,i)=>{
        const corner = i===0 || i===3 || i===12 || i===15;
        p.classList.toggle('lit', breath && corner);
        p.classList.remove('hit','press');
      });
    }
  }
  padTimer = setInterval(tickPads, reduceMotion ? 400 : 110);

  // Elapsed-time ticker — composing label keeps changing
  setInterval(()=>{
    if(phase==='composing'){
      const s=((performance.now()-phaseSince)/1000).toFixed(1);
      $('vtext').textContent='作曲中 '+s+'s';
    } else if(phase==='loading'){
      $('vtext').textContent='加载音频引擎';
    }
  }, 250);

  function setPhase(p){
    phase=p; phaseSince=performance.now();
    if(p==='playing') step=15; // next tick → 0
    playing = (p==='playing');
    const busy = (p==='composing' || p==='loading');
    $('prog').classList.toggle('on', busy);
    const send=$('send');
    send.disabled=busy; send.classList.toggle('busy', busy);
    $('play').disabled=busy; $('surprise').disabled=busy;
    $('playLed').classList.toggle('on', p==='playing');
    if(p==='playing') $('vtext').textContent='演奏中';
    else if(p==='idle') $('vtext').textContent='待机';
  }

  function logLine(html){ const l=$('log'); l.innerHTML += html+'<br>'; l.scrollTop=l.scrollHeight; }
  function setState(html){ $('state').innerHTML=html; }

  async function resumeAudio(){
    try{
      const ac = (typeof getAudioContext==='function') ? getAudioContext() : null;
      if(ac && ac.state!=='running') await ac.resume();
      return ac ? ac.state : null;
    }catch{ return null; }
  }
  function audioState(){
    try{ return (typeof getAudioContext==='function') ? getAudioContext().state : 'none'; }
    catch{ return 'none'; }
  }

  let enginePromise=null;
  function ensureStarted(){
    if(started) return Promise.resolve();
    if(enginePromise) return enginePromise;
    // Samples from THIS origin (/samples) — github raw is blocked in mainland China.
    enginePromise = initStrudel({ prebake: () => samples('/samples/strudel.json') })
      .then(()=>{ started=true; });
    return enginePromise;
  }

  async function playCode(code){
    if(!started){ setPhase('loading'); }
    await ensureStarted();
    try{
      await evaluate(code, true);
      await resumeAudio();
      current=code; $('code').value=code;
      setPhase('playing');
      setState('<b>正在演奏</b> · 改下面代码再按「应用编辑」');
    }catch(e){
      setPhase('idle');
      setState('这段没法播放：'+e.message);
    }
  }

  async function vibe(){
    const intent=$('intent').value.trim();
    if(!intent) return;
    setPhase('composing');
    setState('DeepSeek 正在作曲<span class="dots"></span>（约 3–5 秒）');
    $('vtext').textContent='作曲中';
    logLine('<span class="u">› '+intent.replace(/</g,'&lt;')+'</span>');
    ensureStarted();
    try{
      const r=await fetch('/api/vibe',{method:'POST',headers:{'content-type':'application/json'},
        body:JSON.stringify({intent, current})});
      const data=await r.json();
      if(!r.ok || data.error){
        setPhase('idle');
        setState('出错：'+(data.error||r.status)+(data.detail?(' — '+data.detail):''));
        return;
      }
      logLine('<span class="c">'+(data.code||'').replace(/</g,'&lt;')+'</span>');
      await playCode(data.code);
      $('intent').value='';
    }catch(e){ setPhase('idle'); setState('请求失败：'+e.message); }
  }

  window.__vibe = { phase:()=>phase, phaseSince:()=>phaseSince, audioState, started:()=>started, current:()=>current };

  $('send').onclick=vibe;
  $('intent').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); vibe(); }});
  $('play').onclick=()=>{ const c=$('code').value.trim()||current; if(c) playCode(c); };
  $('apply').onclick=()=>{ const c=$('code').value.trim(); if(c) playCode(c); };
  $('stop').onclick=()=>{ try{ hush(); }catch{} setPhase('idle'); setState('已停止'); };
  $('surprise').onclick=()=>{ $('intent').value = EXAMPLES[Math.floor(Math.random()*EXAMPLES.length)]; vibe(); };

  fetch('/api/vibe',{method:'POST',headers:{'content-type':'application/json'},body:'{}'})
    .then(r=>r.json()).then(d=>{
      const ok = d.error==='intent required';
      $('status2').textContent = ok ? 'API 就绪' : (d.error||'API');
      $('apiLed').classList.toggle('ok', ok);
      $('apiLed').classList.toggle('on', ok);
    })
    .catch(()=>{ $('status2').textContent='API 离线'; });
</script>
</body>
</html>
